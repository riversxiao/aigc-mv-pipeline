id: wan_bi_gui_zhao
source: 史记
classic_title: 完璧归赵
classic_summary: >-
  赵得和氏璧，秦愿以十五城易璧。蔺相如奉璧入秦，见秦王无意真正割城，
  乃设计取回璧，派人密送归赵，自身留秦应对。终使璧完好归赵，亦未辱命。
modern_allegory: >-
  借古讽今职场信用与承诺：别人用「空头大条件」来换你手里的硬通货时，
  先稳住场面，再把真正值钱的东西安全送回家——名声、作品、客户信任、核心代码，
  都是你的「璧」。酒楼开麦版——唱给那些签完字才发现条款是空的人，以及守住底线的人。
themes:
  - 信用
  - 承诺
  - 压力下的清醒
  - 护住核心资产
lyric_seeds:
  - 十五座城画在纸上 璧还在我掌心
  - 先把真东西送回家 再跟你慢慢谈
  - 空头支票换不走我的旧琴
  - 台上演完这场 底线一句没让
  - 名声像璧 摔碎了补不齐
  - 酒楼里不签糊涂账
scene_beats:
  - 诗人双手捧一枚玉佩特写 灯光冷暖交界
  - 对面酒客递来一叠空白契纸 诗人微笑推回
  - 店小二把玉佩装入布袋溜出后门
  - 台上开麦 诗人把玉佩收回袖中再握麦
  - 散场后玉佩与麦克风并置木桌上
avoid:
  - 政治讽刺
  - political satire
  - 当代政局影射
  - 国别对立煽动
notes: >-
  映射职场/创作圈：护作品版权、护客户信任、护合伙人信誉。勿写成国家对抗寓言。
