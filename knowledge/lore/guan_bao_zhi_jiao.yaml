id: guan_bao_zhi_jiao
source: 史记
classic_title: 管鲍之交
classic_summary: >-
  管仲与鲍叔牙少年起交好。管仲家贫，与鲍叔合伙经商时常多取利，鲍叔不以为贪，知他有老母要养；
  管仲做事失败、从军逃跑，鲍叔也不耻笑，知他有所顾念。后鲍叔向齐桓公力荐管仲，自己甘居其下。
  管仲感叹：生我者父母，知我者鲍子也。
modern_allegory: >-
  借古讽今职场与友情：真正的伙伴不是只在顺风局里举杯的人，而是懂你难处、肯替你说话、
  也不抢你风头的人。酒楼开麦版——唱给那个肯把麦克风让给你的旧友。
themes:
  - 信任
  - 知己
  - 让位与成全
  - 穷达不改
lyric_seeds:
  - 分金时你不问我为何多拿
  - 败仗回来你只倒一杯热的
  - 台上聚光灯你往我这边推
  - 知我者不必同姓同乡
  - 酒钱我来付 名声你来撑
  - 多年以后还是同一张桌
scene_beats:
  - 酒楼二人对酌 一人推杯 一人沉默点头
  - 台下旧友举起手机灯 台上诗人闭眼开唱
  - 分账木牌特写 铜钱落桌又被推回
  - 合唱段两人并肩 麦克风从一只手交到另一只
  - 散场后空桌残酒 窗外雨未停
avoid:
  - 政治讽刺
  - political satire
  - 当代政局影射
  - 党争影射
notes: >-
  演示首选典故。适合 demo_guanbao：友情/信任向歌词，避免写成权力斗争寓言。
