id: tongtianlu
source: 一人之下·罗天大醮与八奇技篇（米二）
classic_title: 通天箓·捷径与根基
classic_summary: >-
  八奇技之一「通天箓」省去传统符箓斋戒设坛的繁复仪轨，凌空画符、瞬息成阵，威力惊人。
  陆瑾兼具三一门逆生三重的深厚根基与通天箓的凌厉攻伐，在擂台上既能以指画符漫天流光，
  又始终明白速成奇技终究只是器用，唯有日复一日打磨的心性与底子才立得住脚。
modern_allegory: >-
  映照工具效率与基本功的关系：新工具可以让人一秒画符成阵，就像自动化技术能瞬间放大声量，
  但真正决定作品成色的，依然是创作者长年累月攒下的审美、节奏与苦功。
themes:
  - 效率工具与基本功
  - 凌空成阵与稳扎稳打
  - 克制锋芒
lyric_seeds:
  - 不用设坛不用斋戒 指尖一划符阵开
  - 捷径人人想走 可没根基接不住这一笔
  - 漫天流光只是表象 稳住呼吸才是真章
  - 奇技再快快不过人心 功夫再巧巧不过苦修
scene_beats:
  - 擂台低机位仰拍 唱者指尖划过空气带起淡蓝符纹光轨
  - 对手侧身闪避贴脸反击 双人过肩正反打交替逼压
  - 评委席与前排观众先愣住再起身叫好
  - 收势时符光尽敛 只留稳健站姿与平静眼神
avoid:
  - 政治讽刺
  - political satire
  - 当代政局影射
notes: >-
  适合《异人开麦》及《罗天大醮有嘻哈》系列中涉及奇技与基本功辩证关系的说唱段落与典故底注。
