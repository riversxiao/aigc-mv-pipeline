id: wo_xin_chang_dan
source: 史记
classic_title: 卧薪尝胆
classic_summary: >-
  越王勾践兵败后忍辱求存，归国后自苦其身：睡觉卧于柴薪之上，座旁悬苦胆，
  饮食起居皆尝胆以自励，与民休息、积蓄力量，经年而后复振。
modern_allegory: >-
  借古讽今长期主义与手艺：不是「复仇爽文」，而是熬过低谷时每天给自己一点苦提醒——
  少吹嘘、多练功、把作品打磨到能重新上台。酒楼开麦版——唱给那些失败后仍每晚练嗓、
  改词、攒设备钱的过来人。
themes:
  - 长期主义
  - 手艺与自律
  - 低谷自励
  - 延迟满足
lyric_seeds:
  - 夜里睡在硬板上 醒来先尝一口苦
  - 失败的歌我还在改第二十八稿
  - 聚光灯灭了 弦还要调准
  - 十年一桌酒 只为再开这一嗓
  - 胆苦提醒我 别把苦日子唱成笑话
  - 攒够路费再上路 不靠口头赢
scene_beats:
  - 陋室柴薪铺床 诗人坐起尝一小碟苦酒
  - 空酒楼清晨 一人反复对空麦练气
  - 墙上划满日子的木板特写
  - 多年后重回同一舞台 旧袍新弦
  - 终曲台下灯火渐亮 诗人鞠躬不煽情
avoid:
  - 政治讽刺
  - political satire
  - 当代政局影射
  - 仇恨煽动
  - 美化暴力报复
notes: >-
  刻意改写成「craft persistence」：苦是自律提醒，不是仇敌叙事。适合励志开麦曲。
