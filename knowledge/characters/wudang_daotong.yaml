notes: >-
  原创角色，无原作图，第一步用文生图。原作依据：无，这是为了凑齐王也身后两个队友而原创的武当门下师弟，没有名字，
  不对应原作任何人物。服装用武当灰蓝配色和王也同款交领、同款木珠手串，和王也一眼看出是同门。
