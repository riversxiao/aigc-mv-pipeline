# 武当师弟 · 原创无名角色（不是原作人物），王也的队友。卡片 id 沿用规划里的 wudang_daotong；
# 节目里叫「武当师弟」而不叫「道童」，因为「童」字会让生成模型把人做小。他是 20 岁的成年人。
# 造型按《火影有嘻哈》的做法换成舞台装，用武当的灰蓝配色和王也同款交领，让两人一眼看出是同门。
id: wudang_daotong
display_name: 武当师弟（原创）
age: 20
identity: >-
  a 20-year-old adult Chinese man, tall and thin with long arms, a long narrow face, earnest round dark eyes, thick
  eyebrows, black hair tied in a small Taoist topknot with a plain wooden pin, real skin with fine pores and a little
  sunburn on the cheeks
identity_short: a tall thin adult Chinese man of 20 with a small Taoist topknot and earnest eyes
identity_cn: 20 岁的成年中国男人，又高又瘦，长窄脸，圆眼睛很认真，浓眉；黑发在头顶束成小道髻，插素木簪；皮肤有毛孔，脸颊晒红
wardrobe_default: >-
  a grey-blue cropped jacket cut with a Taoist crossed collar and white collar trim, a white T-shirt, loose grey-blue
  wide trousers, white high-top canvas shoes, a light wooden bead bracelet, plain fabric with no lettering
wardrobe_cn: 灰蓝色交领短外套镶白边，白T恤，灰蓝阔腿裤，白色高帮帆布鞋，浅色木珠手串；衣服上没有文字
props_cn: 双手垂在身侧，不拿话筒
voice: earnest male voice, polite
