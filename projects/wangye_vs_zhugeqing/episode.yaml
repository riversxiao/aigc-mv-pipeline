# 《罗天大醮有嘻哈 第一期：诸葛青 VS 王也》 · 《一人之下》同人二创（腾讯动漫，作者米二）
# 结构照搬 docs/参考片拆解_火影有嘻哈03.md 第 1 节：冷开场、主持开场、分屏入场、对峙、副歌、A 段（输家先唱、更短）、
# 间奏、B 段（赢家后唱、更长）、灭灯停顿揭晓、副歌回归、互动结尾。歌词原创。
# 原作里王也在罗天大醮赢了诸葛青，所以诸葛青先唱、唱得短，王也后唱、唱得长。
# 每句 note 写原作依据；凭记忆写的地方标【待核对】。show_notes: false，注释不烧进画面。
