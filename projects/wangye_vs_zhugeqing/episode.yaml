  en: >-
    a TV rap variety show arena rebuilt from the Luotian tournament ring at night: a black square stage, a giant
    taiji-bagua floor graphic with no lettering, a full red LED wall and red light strips, tiered seats packed with
    people, the dark silhouette of Longhu Mountain at night through an opening at the back
