verses:
  - kind: cold_open
    bars: 2
    shot_cn: 场馆高位全景，灯一排排亮起来
  - kind: host
    who: host
    lines:
      - {text: 欢迎收看 擂台有嘻哈, spoken: true}
      - {text: 今晚 谁才是第一, who: dj, spoken: true}
      - {text: 两位选手 请上台, spoken: true}
  - kind: entrance
    who: host
    bars: 3
    lines:
