  - kind: faceoff
    who: host
    bars: 3
    lines:
      - {text: 请你们 站到对方面前, spoken: true}
  - kind: hook
    who: hook
    lines:
      - text: 啦啦啦 谁是第一
      - text: 啦啦啦 今晚见分晓
      - text: 一句一句 拼到天亮
      - text: 啦啦啦 谁是第一
  - kind: verse
    who: a
    lines:
      - text: 我力拔山兮 气盖世无双
      - text: 你在鸿门宴上 吓得脸发黄
      - text: 老夫子你说 他到底慌不慌
      - text: 拜托！
      - text: 破釜沉舟 我从来不回头望
      - text: 今天这擂台 我一个人就能扛
  - kind: interlude
    who: hook
    bars: 2
    lines:
      - text: 哒哒哒 嘟嘟嘟
  - kind: verse
    who: b
    lines:
      - text: 你说你力气大 力气能当饭吃吗
      - text: 我手下有人 你身边就剩一匹马
      - text: 连韩信都看得清 你那点本事不过如此
      - text: 你一个人扛 我一群人帮
      - text: 等你回头 等你开口 等你认输
      - text: 你那句破釜沉舟 我听着都替你心酸
      - text: 我那句约法三章 天下都跟着我走
      - text: 你们说 谁才是真正的王
  - kind: reveal
    who: b
    lines:
      - text: 论力气 我不跟你拼
      - text: 因为你最强的本事 叫做
      - {text: 逃, pause_beats: 4, beats: 2}
  - kind: outro
    who: b
    bars: 4
    lines:
      - {text: 你们站哪边, spoken: true}
      - {text: 把声音给我, who: host, spoken: true}

