[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aigc-mv"
version = "0.2.0"
description = "Photoreal AI rap-battle / music-video pipeline: canon + beat/lyric timing + film-language storyboard + Seedance prompts + lip-sync measurement + graded conform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AIGC教父" }]
dependencies = [
  "pydantic>=2.0",
  "typer>=0.12",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "numpy>=1.24",
  "soundfile>=0.12",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
asr = ["faster-whisper>=1.0", "pypinyin>=0.50"]  # lyric alignment on the real vocal stem
mcp = ["mcp>=1.0"]  # optional FastMCP server deps

[project.scripts]
aigc-mv = "aigc_mv.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
